name: Deploy on main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Re-seed official itineraries"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_GITHUB_ISSUES_TOKEN: ${{ secrets.APP_GITHUB_ISSUES_TOKEN }}
      PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.toml from example
        run: |
          if [ -z "${APP_GITHUB_ISSUES_TOKEN:-}" ]; then
            echo "::error::APP_GITHUB_ISSUES_TOKEN GitHub secret is not available"
            exit 1
          fi
          cp wrangler.toml.example wrangler.toml
          sed -i "s/PLACEHOLDER_DATABASE_ID/${CLOUDFLARE_DATABASE_ID}/g" wrangler.toml
          node -e 'const fs = require("node:fs"); const path = "wrangler.toml"; const token = JSON.stringify(process.env.APP_GITHUB_ISSUES_TOKEN ?? ""); fs.writeFileSync(path, fs.readFileSync(path, "utf8").replaceAll("\"PLACEHOLDER_GITHUB_ISSUES_TOKEN\"", token));'

      - name: Generate API wrangler.toml from example
        working-directory: apps/api
        run: |
          if [ -z "${PUBLIC_FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error::PUBLIC_FIREBASE_PROJECT_ID GitHub secret is not available"
            exit 1
          fi
          cp wrangler.toml.example wrangler.toml
          node -e 'const fs = require("node:fs"); const path = "wrangler.toml"; const replacements = { PLACEHOLDER_DATABASE_ID: process.env.CLOUDFLARE_DATABASE_ID, PLACEHOLDER_PROD_SECRET: process.env.JWT_SECRET, "your-firebase-project-id": process.env.PUBLIC_FIREBASE_PROJECT_ID }; let config = fs.readFileSync(path, "utf8"); for (const [from, to] of Object.entries(replacements)) config = config.replaceAll(from, to); fs.writeFileSync(path, config);'

      - name: Build all packages
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}

      - name: Create D1 database (remote)
        working-directory: apps/api
        run: pnpm wrangler d1 create tabitabi --remote || echo "Database may already exist"

      - name: Check pending D1 migrations
        id: migrations
        working-directory: apps/api
        run: |
          STATUS=$(node scripts/d1-migrate.mjs status --remote --env production)
          printf '%s\n' "$STATUS"
          if printf '%s\n' "$STATUS" | grep -q '^\[ \]'; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture D1 rollback bookmark
        if: steps.migrations.outputs.pending == 'true'
        id: bookmark
        working-directory: apps/api
        run: |
          JSON=$(pnpm wrangler d1 time-travel info DB --env production --json)
          printf '%s\n' "$JSON"
          BOOKMARK=$(printf '%s' "$JSON" | node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            function findBookmark(node) {
              if (!node || typeof node !== "object") return null;
              if (typeof node.bookmark === "string") return node.bookmark;
              for (const child of Object.values(node)) {
                const found = findBookmark(child);
                if (found) return found;
              }
              return null;
            }
            const bookmark = findBookmark(value);
            if (!bookmark) process.exit(2);
            process.stdout.write(bookmark);
          ')
          echo "bookmark=${BOOKMARK}" >> "$GITHUB_OUTPUT"
          echo "### D1 migration rollback point" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${BOOKMARK}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Restore command: \`pnpm wrangler d1 time-travel restore DB --env production --bookmark=${BOOKMARK}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply D1 migrations (api)
        if: steps.migrations.outputs.pending == 'true'
        working-directory: apps/api
        run: node scripts/d1-migrate.mjs up --remote --env production

      - name: Verify D1 after migrations
        working-directory: apps/api
        run: node scripts/d1-migrate.mjs verify --remote --env production

      - name: Detect seed changes
        id: seed
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "changed=${{ inputs.run_seed }}" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${GITHUB_SHA}" -- apps/db/migrations/seed.sql; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed official itineraries
        if: steps.seed.outputs.changed == 'true'
        working-directory: apps/api
        run: node scripts/d1-migrate.mjs seed --remote --env production

      - name: Deploy API (Workers)
        working-directory: apps/api
        run: pnpm wrangler deploy --env production

      - name: Deploy Web (Pages)
        run: pnpm wrangler pages deploy apps/web/.svelte-kit/cloudflare --project-name=tabitabi --branch=main --commit-message="$(git log -1 --format=%H)"
