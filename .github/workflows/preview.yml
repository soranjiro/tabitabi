name: Preview Environment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      JWT_SECRET: ${{ secrets.PREVIEW_JWT_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_DB_NAME: tabitabi-preview-pr-${{ github.event.pull_request.number }}
      APP_GITHUB_ISSUES_TOKEN: ${{ secrets.APP_GITHUB_ISSUES_TOKEN }}
      PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete existing preview D1 database
        run: |
          pnpm wrangler d1 delete "${PREVIEW_DB_NAME}" --skip-confirmation || echo "Preview database may not exist"

      - name: Create preview D1 database
        id: preview-db
        run: |
          set -euo pipefail
          OUTPUT=$(pnpm wrangler d1 create "${PREVIEW_DB_NAME}" 2>&1)
          echo "$OUTPUT"

          DATABASE_ID=$(printf '%s\n' "$OUTPUT" | sed -nE 's/.*database_id = "([^"]+)".*/\1/p' | head -1)
          if [ -z "$DATABASE_ID" ]; then
            DATABASE_ID=$(printf '%s\n' "$OUTPUT" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -1)
          fi

          if [ -z "$DATABASE_ID" ]; then
            echo "Failed to parse preview D1 database ID from wrangler output" >&2
            exit 1
          fi

          echo "database_id=${DATABASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate wrangler.toml from example
        run: |
          if [ -z "${APP_GITHUB_ISSUES_TOKEN:-}" ]; then
            echo "::error::APP_GITHUB_ISSUES_TOKEN GitHub secret is not available"
            exit 1
          fi
          cp wrangler.toml.example wrangler.toml
          sed -i "s/PLACEHOLDER_DATABASE_ID/${{ steps.preview-db.outputs.database_id }}/g" wrangler.toml
          sed -i "s/database_name = \"tabitabi\"/database_name = \"${PREVIEW_DB_NAME}\"/g" wrangler.toml
          sed -i "s/PLACEHOLDER_PR_NUMBER/${PR_NUMBER}/g" wrangler.toml
          node -e 'const fs = require("node:fs"); const path = "wrangler.toml"; const token = JSON.stringify(process.env.APP_GITHUB_ISSUES_TOKEN ?? ""); fs.writeFileSync(path, fs.readFileSync(path, "utf8").replaceAll("\"PLACEHOLDER_GITHUB_ISSUES_TOKEN\"", token));'

      - name: Generate API wrangler.toml from example
        working-directory: apps/api
        run: |
          if [ -z "${PUBLIC_FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error::PUBLIC_FIREBASE_PROJECT_ID GitHub secret is not available"
            exit 1
          fi
          cp wrangler.toml.example wrangler.toml
          node -e 'const fs = require("node:fs"); const path = "wrangler.toml"; const replacements = { PLACEHOLDER_DATABASE_ID: process.env.PREVIEW_DATABASE_ID, PLACEHOLDER_PREVIEW_SECRET: process.env.JWT_SECRET, "your-firebase-project-id": process.env.PUBLIC_FIREBASE_PROJECT_ID, "database_name = \"tabitabi\"": `database_name = "${process.env.PREVIEW_DB_NAME}"` }; let config = fs.readFileSync(path, "utf8"); for (const [from, to] of Object.entries(replacements)) config = config.replaceAll(from, to); fs.writeFileSync(path, config);'
        env:
          PREVIEW_DATABASE_ID: ${{ steps.preview-db.outputs.database_id }}

      - name: Apply D1 migrations to preview database
        working-directory: apps/api
        run: pnpm wrangler d1 migrations apply DB --remote --env preview

      - name: Deploy API to preview environment
        working-directory: apps/api
        run: |
          WORKER_NAME="tabitabi-api-preview-pr-${PR_NUMBER}"
          pnpm wrangler deploy --name ${WORKER_NAME} --env preview

      - name: Get API preview URL
        id: api-url
        run: |
          echo "url=https://tabitabi-api-preview-pr-${PR_NUMBER}.oranda.workers.dev/api/v1" >> $GITHUB_OUTPUT

      - name: Build web with preview API URL
        run: pnpm run build
        env:
          VITE_API_URL: ${{ steps.api-url.outputs.url }}
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}

      - name: Deploy Web to Pages preview
        id: pages-deploy
        run: |
          BRANCH_NAME="preview-pr-${PR_NUMBER}"
          OUTPUT=$(pnpm wrangler pages deploy apps/web/.svelte-kit/cloudflare --project-name=tabitabi --branch=${BRANCH_NAME})
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[a-z0-9-]+\.tabitabi\.pages\.dev' | head -1)
          echo "url=${URL}" >> $GITHUB_OUTPUT
