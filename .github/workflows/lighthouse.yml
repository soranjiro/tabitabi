name: Lighthouse PR Report

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number to comment on"
        required: true
        type: number
      preview_url:
        description: "Deployed preview URL to audit"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.page }} / ${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: home
            path: /
            device: mobile
          - page: home
            path: /
            device: desktop
          - page: explore
            path: /explore
            device: mobile
          - page: explore
            path: /explore
            device: desktop
    env:
      PREVIEW_URL: ${{ inputs.preview_url }}

    steps:
      - name: Wait for preview page to become available
        run: |
          target_url="${PREVIEW_URL%/}${{ matrix.path }}"
          echo "Warming ${target_url}"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            "$target_url" > /dev/null

      - name: Run Lighthouse 5 times
        id: lighthouse
        run: |
          status=0
          target_url="${PREVIEW_URL%/}${{ matrix.path }}"
          extra_args=()
          if [ "${{ matrix.device }}" = "desktop" ]; then
            extra_args+=(--preset=desktop)
          fi

          for run in 1 2 3 4 5; do
            echo "Running ${{ matrix.device }} Lighthouse for ${{ matrix.path }} (${run}/5)"
            npx --yes lighthouse@latest "$target_url" \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              "${extra_args[@]}" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="./lighthouse-${{ matrix.page }}-${{ matrix.device }}-${run}.json" || status=1
          done

          exit "$status"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pr-${{ inputs.pr_number }}-${{ matrix.page }}-${{ matrix.device }}
          path: lighthouse-${{ matrix.page }}-${{ matrix.device }}-*.json
          if-no-files-found: ignore
          retention-days: 14

  aggregate:
    name: Lighthouse report
    needs: lighthouse
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: ${{ inputs.preview_url }}
      PR_NUMBER: ${{ inputs.pr_number }}
      LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}

    steps:
      - name: Download Lighthouse reports
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-pr-${{ inputs.pr_number }}-*
          merge-multiple: true
          path: lighthouse-reports

      - name: Comment pull request with Lighthouse results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const previewUrl = process.env.PREVIEW_URL;
            const prNumber = Number(process.env.PR_NUMBER);
            const runCount = 5;
            const reportsDir = 'lighthouse-reports';
            const pages = [
              { key: 'home', label: 'Home', path: '/' },
              { key: 'explore', label: 'Explore', path: '/explore' },
            ];

            function readReport(fileName) {
              const reportPath = path.join(reportsDir, fileName);
              if (!fs.existsSync(reportPath)) return null;
              return JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            }

            function readReports(page, device) {
              return Array.from({ length: runCount }, (_, index) =>
                readReport(`lighthouse-${page}-${device}-${index + 1}.json`),
              );
            }

            function trimmedMean(values) {
              const numbers = values.filter((value) => typeof value === 'number' && Number.isFinite(value));
              if (numbers.length !== runCount) return null;
              const sorted = [...numbers].sort((a, b) => a - b);
              const trimmed = sorted.slice(1, -1);
              return trimmed.reduce((sum, value) => sum + value, 0) / trimmed.length;
            }

            function scoreIndicator(score) {
              return score >= 90 ? '🟢' : score >= 50 ? '🟠' : '🔴';
            }

            function categoryScore(report, category) {
              const value = report?.categories?.[category]?.score;
              if (typeof value !== 'number') return '—';
              const score = Math.round(value * 100);
              return `${scoreIndicator(score)} ${score}`;
            }

            function trimmedCategoryScore(reports, category) {
              const value = trimmedMean(reports.map((report) => report?.categories?.[category]?.score));
              if (value === null) return '—';
              const score = Math.round(value * 100);
              return `${scoreIndicator(score)} ${score}`;
            }

            function auditValue(report, audit) {
              return report?.audits?.[audit]?.displayValue ?? '—';
            }

            function formatAuditValue(audit, value) {
              if (audit === 'total-blocking-time') return `${Math.round(value)} ms`;
              if (audit === 'cumulative-layout-shift') return value.toFixed(3);
              return `${(value / 1000).toFixed(1)} s`;
            }

            function trimmedAuditValue(reports, audit) {
              const value = trimmedMean(reports.map((report) => report?.audits?.[audit]?.numericValue));
              return value === null ? '—' : formatAuditValue(audit, value);
            }

            const metrics = [
              { label: 'Performance', type: 'category', key: 'performance' },
              { label: 'Accessibility', type: 'category', key: 'accessibility' },
              { label: 'Best Practices', type: 'category', key: 'best-practices' },
              { label: 'SEO', type: 'category', key: 'seo' },
              { label: 'First Contentful Paint', type: 'audit', key: 'first-contentful-paint' },
              { label: 'Largest Contentful Paint', type: 'audit', key: 'largest-contentful-paint' },
              { label: 'Total Blocking Time', type: 'audit', key: 'total-blocking-time' },
              { label: 'Cumulative Layout Shift', type: 'audit', key: 'cumulative-layout-shift' },
              { label: 'Speed Index', type: 'audit', key: 'speed-index' },
              { label: 'Server response time', type: 'audit', key: 'server-response-time' },
            ];

            function metricValue(report, metric) {
              return metric.type === 'category'
                ? categoryScore(report, metric.key)
                : auditValue(report, metric.key);
            }

            function trimmedMetricValue(reports, metric) {
              return metric.type === 'category'
                ? trimmedCategoryScore(reports, metric.key)
                : trimmedAuditValue(reports, metric.key);
            }

            function summaryTable(mobileReports, desktopReports) {
              const rows = metrics
                .map((metric) => `| ${metric.label} | ${trimmedMetricValue(mobileReports, metric)} | ${trimmedMetricValue(desktopReports, metric)} |`)
                .join('\n');
              return `| Metric | Mobile | Desktop |\n| --- | ---: | ---: |\n${rows}`;
            }

            function detailTable(reports) {
              const header = `| Metric | Run 1 | Run 2 | Run 3 | Run 4 | Run 5 |\n| --- | ---: | ---: | ---: | ---: | ---: |`;
              const rows = metrics
                .map((metric) => `| ${metric.label} | ${reports.map((report) => metricValue(report, metric)).join(' | ')} |`)
                .join('\n');
              return `${header}\n${rows}`;
            }

            function diagnosticSummary(reports) {
              const valid = reports.filter(Boolean);
              if (!valid.length) return 'No diagnostics available.';

              const failureMap = new Map();
              for (const report of valid) {
                for (const categoryKey of ['accessibility', 'best-practices', 'seo']) {
                  for (const ref of report.categories?.[categoryKey]?.auditRefs ?? []) {
                    const audit = report.audits?.[ref.id];
                    if (!audit || typeof audit.score !== 'number' || audit.score >= 1 || ref.weight <= 0) continue;
                    const current = failureMap.get(ref.id) ?? { title: audit.title, count: 0, values: new Set() };
                    current.count += 1;
                    if (audit.displayValue) current.values.add(audit.displayValue);
                    failureMap.set(ref.id, current);
                  }
                }
              }

              const first = valid[0];
              const opportunities = Object.entries(first.audits ?? {})
                .filter(([, audit]) => typeof audit.score === 'number' && audit.score < 1 && ['opportunity', 'table'].includes(audit.details?.type))
                .map(([id, audit]) => ({ id, title: audit.title, savings: audit.details?.overallSavingsMs ?? 0, displayValue: audit.displayValue }))
                .filter((item) => item.savings > 0)
                .sort((a, b) => b.savings - a.savings)
                .slice(0, 8);

              const lcpAudit = first.audits?.['largest-contentful-paint-element'];
              const lcpNode = lcpAudit?.details?.items?.[0]?.node;
              const lcpSnippet = lcpNode?.snippet || lcpNode?.selector || null;

              const lines = [];
              if (failureMap.size) {
                lines.push('**Scored audit failures**');
                for (const [id, item] of failureMap) {
                  const suffix = item.values.size ? ` — ${[...item.values].join(', ')}` : '';
                  lines.push(`- \`${id}\`: ${item.title} (${item.count}/${valid.length} runs)${suffix}`);
                }
              }
              if (opportunities.length) {
                lines.push('', '**Largest opportunities from run 1**');
                for (const item of opportunities) {
                  lines.push(`- \`${item.id}\`: ${item.title}${item.displayValue ? ` — ${item.displayValue}` : ''}`);
                }
              }
              if (lcpSnippet) lines.push('', `**LCP element:** \`${String(lcpSnippet).replace(/`/g, '\\`').slice(0, 300)}\``);
              return lines.length ? lines.join('\n') : 'No scored accessibility / best-practices / SEO failures or material opportunities.';
            }

            const pageSections = pages.map((page) => {
              const mobileReports = readReports(page.key, 'mobile');
              const desktopReports = readReports(page.key, 'desktop');
              const pageUrl = `${previewUrl.replace(/\/$/, '')}${page.path}`;
              return `### ${page.label} \`${page.path}\`

            ${summaryTable(mobileReports, desktopReports)}

            <details>
            <summary>Details for ${page.path}</summary>

            **URL:** ${pageUrl}

            #### Mobile runs

            ${detailTable(mobileReports)}

            ${diagnosticSummary(mobileReports)}

            #### Desktop runs

            ${detailTable(desktopReports)}

            ${diagnosticSummary(desktopReports)}

            </details>`;
            }).join('\n\n');

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const execution = process.env.LIGHTHOUSE_RESULT === 'success'
              ? '✅ All twenty Lighthouse runs completed successfully.'
              : `⚠️ Lighthouse execution issue: matrix=${process.env.LIGHTHOUSE_RESULT}`;

            const body = `## 🔦 Lighthouse Report

            Trimmed mean of 5 runs for each page/device (drop the minimum and maximum, then average the remaining 3):

            ${pageSections}

            ${execution}

            **Preview base:** ${previewUrl}

            Full JSON reports are attached to the [workflow run](${runUrl}) as artifacts.

            _A new comment is posted whenever the preview is redeployed for this pull request._`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Fail when Lighthouse execution failed
        if: always() && needs.lighthouse.result != 'success'
        run: |
          echo "Lighthouse matrix failed: ${{ needs.lighthouse.result }}" >&2
          exit 1
