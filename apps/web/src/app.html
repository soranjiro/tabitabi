<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />

    <!-- 共通設定 -->
    <meta name="keywords" content="旅行, しおり, 旅のしおり, 旅行計画, 無料, Webアプリ, 旅行管理, 行程管理" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="light" />
    <meta name="apple-mobile-web-app-title" content="たびたび" />

    <!-- Google 検証 -->
    <meta name="google-site-verification" content="Xdfjc_OP5gOA4OTSCDjN38wuIU2SbvsLsXK4Ta1MKao" />

    <!-- 基本 -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <style>
      body{margin:0;background:#f9fafb;color:#111827;font-family:system-ui,-apple-system,sans-serif}
    </style>
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"たびたび","description":"旅のしおりをサクッと作成・共有できる無料Webアプリ","url":"https://tabitabi.pages.dev","applicationCategory":"TravelApplication","operatingSystem":"Web","offers":{"@type":"Offer","price":"0","priceCurrency":"JPY"},"inLanguage":"ja"}</script>

    <script>
      window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}
      function loadAnalytics(){
        var s=document.createElement('script');s.src='https://www.googletagmanager.com/gtag/js?id=G-T80SMS1MXE';s.async=true;document.head.appendChild(s);
        gtag('js',new Date());gtag('config','G-T80SMS1MXE')
      }
      if('requestIdleCallback' in window){requestIdleCallback(loadAnalytics,{timeout:4000})}else{setTimeout(loadAnalytics,2000)}
    </script>

    <script>
      (() => {
        const backgrounds = [
          { id: 'spring', position: 'center 48%' },
          { id: 'summer', position: 'center 52%' },
          { id: 'autumn', position: 'center 48%' },
          { id: 'winter', position: 'center 50%' },
        ];
        const randomizedPictures = new WeakSet();

        const randomizeHomeHero = () => {
          const picture = document.querySelector('.hero-picture');
          if (!picture || randomizedPictures.has(picture)) return;

          randomizedPictures.add(picture);
          const background = backgrounds[Math.floor(Math.random() * backgrounds.length)];
          const sources = picture.querySelectorAll('source');
          const image = picture.querySelector('img');

          for (const source of sources) {
            source.srcset = source.type === 'image/avif'
              ? `/hero/background-${background.id}.avif`
              : `/hero/background-${background.id}.webp`;
          }

          if (image) {
            image.src = `/hero/background-${background.id}.webp`;
            image.alt = '旅先の風景';
            image.style.objectPosition = background.position;
          }
        };

        document.addEventListener('DOMContentLoaded', randomizeHomeHero, { once: true });
        new MutationObserver(randomizeHomeHero).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
