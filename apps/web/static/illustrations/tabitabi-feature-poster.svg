</g><g fill="#242423" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif">
<text x="337" y="268" font-size="44" font-weight="300" letter-spacing="12">tabitabi</text>
<text x="337" y="312" font-size="25" letter-spacing="2.3">旅のしおりを、もっと自由に</text>
<text x="921" y="369" font-size="31" letter-spacing="4">しおりを作る</text>
<text x="921" y="407" font-size="19" letter-spacing="1">行きたい場所や予定をまとめて</text>
<text x="921" y="434" font-size="19" letter-spacing="1">自分だけの旅のしおりを作成</text>
<text x="217" y="765" font-size="31" letter-spacing="3">多彩なデザイン</text>
<text x="217" y="803" font-size="19">旅のスタイルに合わせて</text>
<text x="217" y="830" font-size="19">選べるテーマで、見やすくおしゃれに</text>
<text x="610" y="765" font-size="31" letter-spacing="3">SNSで共有</text>
<text x="610" y="803" font-size="19">作ったしおりをみんなと共有して</text>
<text x="610" y="830" font-size="19">旅の楽しさを広げよう</text>
<text x="1006" y="765" font-size="31" letter-spacing="2">お金・持ち物の管理</text>
<text x="1006" y="803" font-size="19">予算や支出の管理、</text>
<text x="1006" y="830" font-size="19">持ち物リストで準備もスムーズに</text>
<text x="302" y="1190" font-size="31" letter-spacing="3">シークレットモード</text>
<text x="302" y="1231" font-size="19">予定を見せるタイミングも自由に</text>
<text x="302" y="1258" font-size="19">時間になったら予定を公開</text>
<text x="920" y="1190" font-size="31" letter-spacing="3">いつでも、どこでも</text>
<text x="920" y="1231" font-size="19">スマホでもPCでも、</text>
<text x="920" y="1258" font-size="19">旅の計画・編集・閲覧ができる</text>
</g></svg>