name: Generate landing poster SVGs

on:
  push:
    branches:
      - feat/landing-continuous-line-features
    paths:
      - .github/workflows/generate-landing-poster-svg.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vectorize:
    if: github.repository == 'soranjiro/tabitabi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install one-time vectorization tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless scour
      - name: Convert reference art to true path SVG
        run: python apps/web/scripts/trace-landing-poster.py
      - name: Commit vector assets to feature branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/static/illustrations/tabitabi-feature-poster.svg apps/web/static/illustrations/tabitabi-feature-poster-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m "feat(home): add traced vector line art for desktop and mobile"
            git push origin "HEAD:$BRANCH_NAME"
          fi
