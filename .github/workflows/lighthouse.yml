name: Lighthouse PR Report

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number to comment on"
        required: true
        type: number
      preview_url:
        description: "Deployed preview URL to audit"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse (mobile + desktop)
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ inputs.preview_url }}
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Wait for preview to become available
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            "$PREVIEW_URL" > /dev/null

      - name: Run Lighthouse for mobile (3 times)
        id: mobile
        continue-on-error: true
        run: |
          status=0
          for run in 1 2 3; do
            echo "Running mobile Lighthouse (${run}/3)"
            npx --yes lighthouse@latest "$PREVIEW_URL" \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="./lighthouse-mobile-${run}.json" || status=1
          done
          exit "$status"

      - name: Run Lighthouse for desktop (3 times)
        id: desktop
        continue-on-error: true
        run: |
          status=0
          for run in 1 2 3; do
            echo "Running desktop Lighthouse (${run}/3)"
            npx --yes lighthouse@latest "$PREVIEW_URL" \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --preset=desktop \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="./lighthouse-desktop-${run}.json" || status=1
          done
          exit "$status"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pr-${{ inputs.pr_number }}
          path: |
            lighthouse-mobile-*.json
            lighthouse-desktop-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment pull request with Lighthouse results
        if: always()
        uses: actions/github-script@v7
        env:
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- tabitabi-lighthouse -->';
            const previewUrl = process.env.PREVIEW_URL;
            const prNumber = Number(process.env.PR_NUMBER);
            const runCount = 3;

            function readReport(path) {
              if (!fs.existsSync(path)) return null;
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            }

            function readReports(device) {
              return Array.from({ length: runCount }, (_, index) =>
                readReport(`lighthouse-${device}-${index + 1}.json`),
              );
            }

            function median(values) {
              const numbers = values.filter((value) => typeof value === 'number' && Number.isFinite(value));
              if (numbers.length !== runCount) return null;
              return [...numbers].sort((a, b) => a - b)[1];
            }

            function scoreIndicator(score) {
              return score >= 90 ? '🟢' : score >= 50 ? '🟠' : '🔴';
            }

            function categoryScore(report, category) {
              const value = report?.categories?.[category]?.score;
              if (typeof value !== 'number') return '—';
              const score = Math.round(value * 100);
              return `${scoreIndicator(score)} ${score}`;
            }

            function medianCategoryScore(reports, category) {
              const value = median(reports.map((report) => report?.categories?.[category]?.score));
              if (value === null) return '—';
              const score = Math.round(value * 100);
              return `${scoreIndicator(score)} ${score}`;
            }

            function auditValue(report, audit) {
              return report?.audits?.[audit]?.displayValue ?? '—';
            }

            function medianAuditValue(reports, audit) {
              const candidates = reports
                .map((report) => ({
                  numericValue: report?.audits?.[audit]?.numericValue,
                  displayValue: report?.audits?.[audit]?.displayValue,
                }))
                .filter(({ numericValue }) => typeof numericValue === 'number' && Number.isFinite(numericValue));

              if (candidates.length !== runCount) return '—';
              candidates.sort((a, b) => a.numericValue - b.numericValue);
              return candidates[1].displayValue ?? String(candidates[1].numericValue);
            }

            const mobileReports = readReports('mobile');
            const desktopReports = readReports('desktop');

            const metrics = [
              { label: 'Performance', type: 'category', key: 'performance' },
              { label: 'Accessibility', type: 'category', key: 'accessibility' },
              { label: 'Best Practices', type: 'category', key: 'best-practices' },
              { label: 'SEO', type: 'category', key: 'seo' },
              { label: 'First Contentful Paint', type: 'audit', key: 'first-contentful-paint' },
              { label: 'Largest Contentful Paint', type: 'audit', key: 'largest-contentful-paint' },
              { label: 'Total Blocking Time', type: 'audit', key: 'total-blocking-time' },
              { label: 'Cumulative Layout Shift', type: 'audit', key: 'cumulative-layout-shift' },
              { label: 'Speed Index', type: 'audit', key: 'speed-index' },
            ];

            function metricValue(report, metric) {
              return metric.type === 'category'
                ? categoryScore(report, metric.key)
                : auditValue(report, metric.key);
            }

            function medianMetricValue(reports, metric) {
              return metric.type === 'category'
                ? medianCategoryScore(reports, metric.key)
                : medianAuditValue(reports, metric.key);
            }

            const medianRows = metrics
              .map((metric) =>
                `| ${metric.label} | ${medianMetricValue(mobileReports, metric)} | ${medianMetricValue(desktopReports, metric)} |`,
              )
              .join('\n');

            function detailTable(reports) {
              const header = `| Metric | Run 1 | Run 2 | Run 3 |\n| --- | ---: | ---: | ---: |`;
              const rows = metrics
                .map((metric) => {
                  const values = reports.map((report) => metricValue(report, metric));
                  return `| ${metric.label} | ${values.join(' | ')} |`;
                })
                .join('\n');
              return `${header}\n${rows}`;
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const execution = process.env.MOBILE_OUTCOME === 'success' && process.env.DESKTOP_OUTCOME === 'success'
              ? '✅ All six Lighthouse runs completed successfully.'
              : `⚠️ Lighthouse execution issue: mobile=${process.env.MOBILE_OUTCOME}, desktop=${process.env.DESKTOP_OUTCOME}`;

            const body = `${marker}
            ## 🔦 Lighthouse Report

            Median of 3 runs for each device:

            | Metric | Mobile | Desktop |
            | --- | ---: | ---: |
            ${medianRows}

            <details>
            <summary>Details</summary>

            ${execution}

            **Preview:** ${previewUrl}

            ### Mobile runs

            ${detailTable(mobileReports)}

            ### Desktop runs

            ${detailTable(desktopReports)}

            Full JSON reports are attached to the [workflow run](${runUrl}) as an artifact.

            </details>

            _This comment is updated whenever the preview is redeployed for this pull request._`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Fail when Lighthouse execution failed
        if: always() && (steps.mobile.outcome != 'success' || steps.desktop.outcome != 'success')
        run: |
          echo "Lighthouse failed: mobile=${{ steps.mobile.outcome }}, desktop=${{ steps.desktop.outcome }}" >&2
          exit 1
