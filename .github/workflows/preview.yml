name: Preview Environment

on:
  pull_request:
    branches:
      - main
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to deploy"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  resolve-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/deploy-preview') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      sha: ${{ steps.resolve.outputs.sha }}
      head_repo: ${{ steps.resolve.outputs.head_repo }}
    steps:
      - name: Resolve and validate pull request
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : context.eventName === 'issue_comment'
                ? context.payload.issue.number
                : Number('${{ inputs.pr_number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // issue_comment and workflow_dispatch are not scoped by the
            // pull_request.branches filter. Reject closed or off-main PRs
            // before any secret-bearing preview deployment is scheduled.
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.base.repo?.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Preview deployments require an open PR targeting this repository main');
              return;
            }

            core.setOutput('pr_number', String(pr.number));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo?.full_name ?? '');

            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket',
              });
            }

  deploy-preview:
    needs: resolve-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      needs.resolve-preview.outputs.head_repo == github.repository
    outputs:
      web_url: ${{ steps.pages-deploy.outputs.url }}
      api_url: ${{ steps.api-url.outputs.url }}
    env:
      PR_NUMBER: ${{ needs.resolve-preview.outputs.pr_number }}
      PREVIEW_DB_NAME: tabitabi-preview-pr-${{ needs.resolve-preview.outputs.pr_number }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-preview.outputs.sha }}

      # This repository contains a legacy gitlink without a .gitmodules entry.
      # checkout@v4 with persist-credentials:false fails while cleaning its auth
      # during checkout. Strip the credential immediately before any PR code runs.
      - name: Remove checkout token from Git configuration
        shell: bash
        run: git config --local --unset-all 'http.https://github.com/.extraheader' || true

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      # PR-controlled dependency scripts must not persist a package-manager cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete existing preview D1 database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler d1 delete "${PREVIEW_DB_NAME}" --skip-confirmation || echo "Preview database may not exist"

      - name: Create preview D1 database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        id: preview-db
        run: |
          set -euo pipefail
          OUTPUT=$(pnpm wrangler d1 create "${PREVIEW_DB_NAME}" 2>&1)
          echo "$OUTPUT"

          DATABASE_ID=$(printf '%s\n' "$OUTPUT" | sed -nE 's/.*database_id["[:space:]]*[:=][[:space:]]*"([0-9a-fA-F-]{36})".*/\1/p' | sed -n '1p')
          if [ -z "$DATABASE_ID" ]; then
            DATABASE_ID=$(printf '%s\n' "$OUTPUT" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | sed -n '1p' || true)
          fi

          if [ -z "$DATABASE_ID" ]; then
            echo "Failed to parse preview D1 database ID from wrangler output" >&2
            exit 1
          fi

          echo "database_id=${DATABASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate wrangler.toml from example
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i "s/PLACEHOLDER_DATABASE_ID/${{ steps.preview-db.outputs.database_id }}/g" wrangler.toml
          sed -i "s/database_name = \"tabitabi\"/database_name = \"${PREVIEW_DB_NAME}\"/g" wrangler.toml
          sed -i "s/PLACEHOLDER_PR_NUMBER/${PR_NUMBER}/g" wrangler.toml

      - name: Generate API wrangler.toml from example
        working-directory: apps/api
        run: |
          if [ -z "${PUBLIC_FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error::PUBLIC_FIREBASE_PROJECT_ID GitHub secret is not available"
            exit 1
          fi
          cp wrangler.toml.example wrangler.toml
          node -e 'const fs = require("node:fs"); const path = "wrangler.toml"; const replacements = { PLACEHOLDER_DATABASE_ID: process.env.PREVIEW_DATABASE_ID, "your-firebase-project-id": process.env.PUBLIC_FIREBASE_PROJECT_ID, "database_name = \"tabitabi\"": `database_name = "${process.env.PREVIEW_DB_NAME}"`, "PLACEHOLDER_PR_NUMBER": process.env.PR_NUMBER }; let config = fs.readFileSync(path, "utf8"); for (const [from, to] of Object.entries(replacements)) config = config.replaceAll(from, to); fs.writeFileSync(path, config);'
        env:
          PREVIEW_DATABASE_ID: ${{ steps.preview-db.outputs.database_id }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}

      - name: Load D1 schema into preview database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/api
        run: pnpm wrangler d1 execute DB --remote --env preview --yes --file ../db/schema.sql

      - name: Seed preview database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/api
        run: node scripts/d1-migrate.mjs seed --remote --env preview

      - name: Deploy API to preview environment with encrypted JWT binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.PREVIEW_JWT_SECRET }}
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JWT_SECRET:-}" ]; then
            echo "::error::PREVIEW_JWT_SECRET GitHub secret is not available" >&2
            exit 1
          fi
          WORKER_NAME="tabitabi-api-preview-pr-${PR_NUMBER}"
          secrets_file="$RUNNER_TEMP/tabitabi-preview-api-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ JWT_SECRET: process.env.JWT_SECRET }), { mode: 0o600 });' "$secrets_file"
          pnpm wrangler deploy --name "$WORKER_NAME" --env preview --secrets-file "$secrets_file"

      - name: Get API preview URL
        id: api-url
        run: |
          echo "url=https://tabitabi-api-preview-pr-${PR_NUMBER}.oranda.workers.dev/api/v1" >> $GITHUB_OUTPUT

      - name: Build web with preview API URL
        run: pnpm run build
        env:
          VITE_API_URL: ${{ steps.api-url.outputs.url }}
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}

      - name: Configure encrypted Pages feedback token (preview)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_GITHUB_ISSUES_TOKEN: ${{ secrets.APP_GITHUB_ISSUES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APP_GITHUB_ISSUES_TOKEN:-}" ]; then
            echo "::error::APP_GITHUB_ISSUES_TOKEN GitHub secret is not available" >&2
            exit 1
          fi
          printf '%s' "$APP_GITHUB_ISSUES_TOKEN" | pnpm wrangler pages secret put APP_GITHUB_ISSUES_TOKEN --project-name=tabitabi --env preview

      - name: Deploy Web to Pages preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        id: pages-deploy
        run: |
          set -euo pipefail
          BRANCH_NAME="preview-pr-${PR_NUMBER}"
          OUTPUT=$(pnpm wrangler pages deploy apps/web/.svelte-kit/cloudflare --project-name=tabitabi --branch=${BRANCH_NAME})
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[a-z0-9-]+\.tabitabi\.pages\.dev' | head -1)
          if [ -z "$URL" ]; then
            echo "Failed to determine the Pages preview URL" >&2
            exit 1
          fi
          echo "url=${URL}" >> $GITHUB_OUTPUT

  publish-deployment:
    name: Publish preview deployment
    needs:
      - resolve-preview
      - deploy-preview
    if: needs.deploy-preview.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview-pr-${{ needs.resolve-preview.outputs.pr_number }}
      url: ${{ needs.deploy-preview.outputs.web_url }}
    steps:
      - name: Show deployed URLs
        env:
          WEB_URL: ${{ needs.deploy-preview.outputs.web_url }}
          API_URL: ${{ needs.deploy-preview.outputs.api_url }}
          PR_NUMBER: ${{ needs.resolve-preview.outputs.pr_number }}
        run: |
          {
            echo '### Preview environment'
            echo
            printf -- '- **Web:** %s\n' "$WEB_URL"
            printf -- '- **API:** %s\n' "$API_URL"
            printf -- '- **D1 Database:** `tabitabi-preview-pr-%s`\n' "$PR_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"

  preview-smoke:
    permissions:
      contents: read
    needs:
      - resolve-preview
      - deploy-preview
    if: needs.deploy-preview.result == 'success'
    # Playwright 1.57 does not provide chromium-headless-shell for Ubuntu 26.04.
    # Pin the smoke runner until the browser toolchain supports that image.
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ needs.resolve-preview.outputs.pr_number }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-preview.outputs.sha }}

      # This repository contains a legacy gitlink without a .gitmodules entry.
      # checkout@v4 with persist-credentials:false fails while cleaning its auth
      # during checkout. Strip the credential immediately before any PR code runs.
      - name: Remove checkout token from Git configuration
        shell: bash
        run: git config --local --unset-all 'http.https://github.com/.extraheader' || true

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      # PR-controlled dependency scripts must not persist a package-manager cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for preview smoke tests
        run: pnpm --filter web exec playwright install --with-deps --only-shell chromium

      - name: Exercise deployed preview
        run: pnpm --filter web exec playwright test tests/e2e/preview-background-settings.spec.ts tests/e2e/home-preview-visual.spec.ts tests/e2e/chatgpt-preview.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.web_url }}
          PREVIEW_API_URL: ${{ needs.deploy-preview.outputs.api_url }}

      - name: Upload preview background smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-background-pr-${{ env.PR_NUMBER }}
          path: apps/web/test-results
          if-no-files-found: ignore

  lighthouse:
    permissions:
      contents: read
    needs:
      - resolve-preview
      - deploy-preview
    if: needs.deploy-preview.result == 'success'
    uses: ./.github/workflows/lighthouse.yml
    with:
      pr_number: ${{ fromJSON(needs.resolve-preview.outputs.pr_number) }}
      preview_url: ${{ needs.deploy-preview.outputs.web_url }}
