name: CI

on:
  push:
    branches: ["copilot/**"]
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "docs/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration policy
        id: policy
        run: node apps/db/scripts/check-migrations.mjs origin/main

      - name: Verify migrations preserve existing data
        id: preservation
        run: node apps/db/scripts/test-migrations.mjs

      - name: Comment migration safety result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          PRESERVATION_OUTCOME: ${{ steps.preservation.outcome }}
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const migrations = files
              .map((file) => file.filename)
              .filter((name) => name.startsWith('apps/db/migrations/sql/') && name.endsWith('.sql'));

            if (migrations.length === 0) return;

            const icon = (outcome) => outcome === 'success' ? '✅' : outcome === 'skipped' ? '⏭️' : '❌';
            const policy = process.env.POLICY_OUTCOME || 'unknown';
            const preservation = process.env.PRESERVATION_OUTCOME || 'unknown';
            const ok = policy === 'success' && preservation === 'success';
            const marker = '<!-- tabitabi-migration-safety -->';
            const migrationList = migrations.map((name) => `- \`${name}\``).join('\n');
            const body = `${marker}
            ## ${ok ? '✅' : '🚨'} Database Migration Detected

            Migration files changed in this PR:
            ${migrationList}

            ### Safety checks
            - ${icon(policy)} Migration policy / destructive SQL check: **${policy}**
            - ${icon(preservation)} Existing data preservation + foreign key check: **${preservation}**

            ${ok
              ? 'The migration safety checks passed. Production will capture a D1 Time Travel bookmark before applying any pending migration.'
              : '**Do not merge this PR until the failed migration safety check is resolved.**'}

            Production seed is not run unless \`apps/db/migrations/seed.sql\` changed or it is explicitly requested from a manual deploy.
            `;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated database schema
        run: pnpm run db:schema:check

      - name: Run API Tests
        run: pnpm run test:api

      - name: Run Web Tests
        run: pnpm run test:web

  build:
    runs-on: ubuntu-latest
    needs:
      - migration-safety
      - test
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # CI only needs to compile the client. Deploy workflows inject the real values.
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY || 'ci-placeholder-api-key' }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID || 'ci-placeholder-app-id' }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci-placeholder.firebaseapp.com' }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID || 'ci-placeholder-project' }}
