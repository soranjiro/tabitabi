# Temporary read-only lockfile resolver. Removed before merge.
name: Security lockfile resolution
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drop checkout credential
        shell: bash
        run: git config --local --unset-all 'http.https://github.com/.extraheader' || true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile without running package scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Print exact lockfile diff (no secrets)
        shell: bash
        run: |
          echo 'LOCKFILE_DIFF_START'
          git diff --no-ext-diff -- pnpm-lock.yaml
          echo 'LOCKFILE_DIFF_END'
